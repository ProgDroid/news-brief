# newsbrief — one image, one config source.
#
# The image's ENTRYPOINT is `python brief.py`, so a service differs ONLY by the mode
# in `command:`. All shared configuration lives once in the &newsbrief anchor —
# change the image tag, user, volume, or env in ONE place and every mode inherits it.
#
# Values are interpolated from your stack environment / a .env beside this file:
#   ANTHROPIC_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID   (required)
#   POSTGRES_PASSWORD                                         (required)
#   T212_API_KEY, T212_BASE_URL, CHROMA_MCP_URL, NITTER_BASE_URL  (optional)
#   PUID / PGID    — host uid:gid that OWNS the logs volume (runs the container non-root)
#   APPDATA_DIR    — host path for persistent state + archives
#
# Start the whole stack once and leave it up:
#   docker compose up -d
#
# There is no cron here any more and there must not be: the supervisor owns
# scheduling, and the table lives in `scheduler.SCHEDULES`. Adding a host cron
# entry back alongside it produces a second, competing run of the same job.
# Because scheduling is now internal, a stack `up` starts NO work — jobs run when
# they are due, and a redeploy runs only what the catch-up rule says was missed.
#
# A one-off run by hand is still `docker compose run --rm`, which takes its own
# ledger row and is interlocked against the supervisor's copy of the same job:
#   docker compose run --rm newsbrief collect    # force a collect now
#   docker compose run --rm --entrypoint bash newsbrief   # a shell in the image
#
# `pgdiag` is NOT a Postgres tool despite how it now reads next to the postgres
# service — "pg" is PolyGram. It is a read-only probe of the live prediction-market
# seam. To inspect the run ledger, query Postgres directly:
#   docker compose exec -T postgres psql -U newsbrief -d newsbrief -c "TABLE job_runs;"
#   docker compose run --rm newsbrief pgdiag    # PolyGram (prediction markets), not Postgres
#
# Only ONE getUpdates consumer may run per bot. The supervisor keeps the Telegram
# daemon resident as a child, so it is that one consumer — do not also start a
# `commands` service or run the mode by hand, or the bot 409s and goes deaf.

x-newsbrief: &newsbrief
  image: ghcr.io/progdroid/news-brief:latest
  # Real non-root: the process runs as this uid:gid, which must own ${APPDATA_DIR}/news-brief.
  # (PUID/PGID as plain env vars do nothing on this image — `user:` is the lever that works.)
  user: "${PUID:-1000}:${PGID:-1000}"
  environment:
    - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    - T212_API_KEY_ID=${T212_API_KEY_ID:-}
    - T212_API_KEY=${T212_API_KEY:-}
    - T212_BASE_URL=${T212_BASE_URL:-https://live.trading212.com}
    - APCA_API_KEY_ID=${APCA_API_KEY_ID:-}
    - APCA_API_SECRET_KEY=${APCA_API_SECRET_KEY:-}
    - APCA_DATA_URL=${APCA_DATA_URL:-https://data.alpaca.markets}
    - POLYGRAM_EMAIL=${POLYGRAM_EMAIL:-}
    - POLYGRAM_PASSWORD=${POLYGRAM_PASSWORD:-}
    # Modal proxy auth for the podcast MCP endpoint, which is deployed with
    # requires_proxy_auth=True. Without these the call 401s at Modal's edge and
    # the brief ships with no podcast context — and setting them on the host or
    # in .env does nothing on its own, because compose passes through ONLY what
    # is declared here. brief.py logs a warning naming the cause when unset.
    - MODAL_PROXY_KEY=${MODAL_PROXY_KEY:-}
    - MODAL_PROXY_SECRET=${MODAL_PROXY_SECRET:-}
    # Live prediction trading (REAL MONEY). All default to off/empty, and an empty
    # value keeps common.py's built-in default — so omitting them from your .env is
    # exactly as safe as not having these lines at all. Compose passes through ONLY
    # what is declared here: setting PG_LIVE_ENABLED on the host or in .env without
    # a line below leaves it unset INSIDE the container, and every sleeve no-ops.
    - PG_LIVE_ENABLED=${PG_LIVE_ENABLED:-}
    - PG_LIVE_TOTAL_CAP=${PG_LIVE_TOTAL_CAP:-}
    - PG_LIVE_PER_TRADE_CAP=${PG_LIVE_PER_TRADE_CAP:-}
    - PG_A_ENABLED=${PG_A_ENABLED:-}
    - PG_A_STAKE=${PG_A_STAKE:-}
    - PG_A_BAND_LO=${PG_A_BAND_LO:-}
    - PG_A_BAND_HI=${PG_A_BAND_HI:-}
    - PG_A_SPREAD_GATE=${PG_A_SPREAD_GATE:-}
    - PG_A_TAKE=${PG_A_TAKE:-}
    - PG_A_STOP=${PG_A_STOP:-}
    - PG_A_TIME_STOP_DAYS=${PG_A_TIME_STOP_DAYS:-}
    - PG_A_NEAR_DAYS=${PG_A_NEAR_DAYS:-}
    - PG_B_ENABLED=${PG_B_ENABLED:-}
    - PG_B_POS_CAP=${PG_B_POS_CAP:-}
    - PG_B_TOTAL_CAP=${PG_B_TOTAL_CAP:-}
    - PG_THESIS_GRACE_DAYS=${PG_THESIS_GRACE_DAYS:-}
    # Self-hosted Nitter on the shared network (Twitter/X feeds). Defaults to the
    # service named `nitter` on Nitter's internal port 8080; override if it differs.
    - NITTER_BASE_URL=${NITTER_BASE_URL:-http://nitter:8080}
    # Postgres holds the run ledger, the advisory locks that interlock the entry
    # paths, and the scheduler's state. These MUST be declared here: compose
    # passes through only what this block names, so setting them on the host or
    # in .env alone leaves them unset inside the container and every job refuses
    # to start — db.conninfo says exactly that, naming the ones it could not find.
    #
    # They are the SAME variables the `postgres` service below is configured
    # with, so setting POSTGRES_PASSWORD alone is enough and the two sides cannot
    # disagree. Nothing here builds a URI: db.conninfo hands the values to
    # psycopg's make_conninfo, which escapes each one as a keyword/value pair, so
    # the password is carried as a VALUE and never has to survive a URI parse.
    # `/`, `%` and `@` in a password are safe now; they were not when this line
    # spliced them into a postgresql:// URI, where `/` was read as the start of
    # the port, `@` truncated the password and corrupted the host, and `%cd`
    # decoded silently to a DIFFERENT password.
    #
    # One trap is left, and it is compose's rather than libpq's: a `$` in a .env
    # value is eaten by interpolation unless written `$$`, identically here AND
    # on the postgres service below — so the stack comes up and works with a
    # shorter password than you wrote. Generate it with `openssl rand -hex 32`
    # and there is nothing to escape.
    - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
    - POSTGRES_PORT=${POSTGRES_PORT:-5432}
    - POSTGRES_USER=${POSTGRES_USER:-newsbrief}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    - POSTGRES_DB=${POSTGRES_DB:-newsbrief}
    # Set DATABASE_URL to point at a database OUTSIDE this stack: when it is
    # non-empty it wins over the five above. It is a URI, so percent-encode the
    # password in it if the password needs it. POSTGRES_PASSWORD stays required
    # either way — the bundled postgres service below still starts and still
    # demands one.
    - DATABASE_URL=${DATABASE_URL:-}
    # - CHROMA_MCP_URL=${CHROMA_MCP_URL}   # optional: override the default podcast MCP endpoint
  volumes:
    - "${APPDATA_DIR:-./appdata}/news-brief:/app/logs"
  restart: "no"
  # The Twitter/X feeds resolve `nitter` over Docker DNS, so this stack must share a
  # network with your Nitter container. Attach it here (and declare the external
  # network under the top-level `networks:` block below):
  # networks: [ default, nitter_network ]

services:
  # One long-lived service. Its supervisor owns scheduling, spawns each job as a
  # child process, and keeps the Telegram daemon resident. A stack `up` therefore
  # starts no work: jobs run when they are due, and a redeploy runs only what the
  # catch-up rule says was actually missed.
  newsbrief:
    <<: *newsbrief
    command: [serve]
    # The anchor defaults to restart: "no". This override is load-bearing, not
    # cosmetic: a resident child that fails to spawn still takes the supervisor
    # down, and this is what makes that self-heal instead of stopping the stack.
    restart: unless-stopped
    # Must exceed the WHOLE of supervisor.shutdown, not just its child-exit
    # budget: 25s budget + 2s drain + 5s connect + 4s of ledger writes + 2s reap,
    # plus up to 5s for a tick-path connect already in flight when the signal
    # arrived — ~43s. The arithmetic is written out beside
    # SHUTDOWN_BUDGET_SECONDS in supervisor.py.
    #
    # The remaining ~17s is NOT slack to be reclaimed. It is cover for the two
    # things that sum cannot bound: statement_timeout does not abort a COMMIT
    # already blocked in fsync, and closing a wedged socket is unbounded too.
    # Grace costs nothing when it is not used — Docker waits only until the
    # process exits, and a healthy stop takes about a second.
    #
    # Docker's default is 10s, which would SIGKILL the supervisor mid-shutdown
    # and leave `running` rows for the next boot to report as orphans —
    # reinstating, on every routine deploy, the false alert that spec section 8's
    # shutdown handling exists to remove. If you tune either number, tune both.
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  # Deliberately does NOT inherit the anchor: the official image manages its own
  # uid, and a `user:` override against an initialised data directory fails in a
  # way that reads as corruption.
  postgres:
    # Same major as CI and as the psycopg pinned in requirements.txt.
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-newsbrief}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-newsbrief}
    volumes:
      - newsbrief-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-newsbrief}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  newsbrief-pgdata:

# Uncomment to attach to a network shared with your self-hosted RSSHub/Nitter stack:
# networks:
#   nitter_network:
#     external: true
