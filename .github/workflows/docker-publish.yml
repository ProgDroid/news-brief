name: Test, build and publish Docker image

on:
  push:
    branches: [main]
    paths:
      - 'brief.py'
      - 'capture.py'
      - 'brief_memory.py'
      - 'claim_store.py'
      - 'claim_verify.py'
      - 'retention.py'
      - 'common.py'
      - 'config.py'
      - 'trading.py'
      - 'polygram_live.py'
      - 'validation.py'
      - 'db.py'
      - 'scheduler.py'
      - 'supervisor.py'
      - 'backup.py'
      - 'migrations/**'
      - 'enrichment/**'
      - 'scripts/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:   # lets you trigger a build manually from the Actions tab

# Serialise runs so two close pushes can't race for the `latest` tag.
concurrency:
  group: docker-publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Actions are pinned to commit SHAs (tag in the comment): tags are mutable, and
# this workflow publishes the production image — supply-chain hygiene matters.
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: newsbrief
          POSTGRES_USER: newsbrief
          POSTGRES_DB: newsbrief_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check brief.py capture.py brief_memory.py claim_store.py claim_verify.py retention.py common.py config.py trading.py polygram_live.py validation.py db.py scheduler.py supervisor.py backup.py enrichment scripts tests
          ruff format --check brief.py capture.py brief_memory.py claim_store.py claim_verify.py retention.py common.py config.py trading.py polygram_live.py validation.py db.py scheduler.py supervisor.py backup.py enrichment scripts tests

      - name: Test
        env:
          DATABASE_URL: postgresql://newsbrief:newsbrief@localhost:5432/newsbrief_test
        run: pytest -q

  build-and-push:
    runs-on: ubuntu-latest
    needs: test   # a failing test suite must never publish an image
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # OCI references must be lowercase, but github.repository preserves the
      # owner's case (e.g. ProgDroid). metadata-action lowercases its tags
      # internally, so build/push is fine — but trivy gets the raw IMAGE_NAME
      # and rejects an uppercase ref ("could not parse reference"). Lowercase once.
      - name: Lowercase image ref
        id: img
        run: echo "ref=${REGISTRY}/${IMAGE_NAME,,}:latest" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      # Scan the published image for OS/library CVEs. Fails the run on a fixable
      # CRITICAL/HIGH so a vulnerable base image surfaces instead of shipping silently.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.ref }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
