name: Test, build and publish Docker image

on:
  push:
    branches: [main]
    paths:
      - 'brief.py'
      - 'brief_memory.py'
      - 'claim_verify.py'
      - 'retention.py'
      - 'common.py'
      - 'trading.py'
      - 'polygram_live.py'
      - 'validation.py'
      - 'enrichment/**'
      - 'scripts/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:   # lets you trigger a build manually from the Actions tab

# Serialise runs so two close pushes can't race for the `latest` tag.
concurrency:
  group: docker-publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Actions are pinned to commit SHAs (tag in the comment): tags are mutable, and
# this workflow publishes the production image — supply-chain hygiene matters.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check brief.py brief_memory.py claim_verify.py retention.py common.py trading.py polygram_live.py validation.py enrichment scripts tests
          ruff format --check brief.py brief_memory.py claim_verify.py retention.py common.py trading.py polygram_live.py validation.py enrichment scripts tests

      - name: Test
        run: pytest -q

  build-and-push:
    runs-on: ubuntu-latest
    needs: test   # a failing test suite must never publish an image
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # OCI references must be lowercase, but github.repository preserves the
      # owner's case (e.g. ProgDroid). metadata-action lowercases its tags
      # internally, so build/push is fine — but trivy gets the raw IMAGE_NAME
      # and rejects an uppercase ref ("could not parse reference"). Lowercase once.
      - name: Lowercase image ref
        id: img
        run: echo "ref=${REGISTRY}/${IMAGE_NAME,,}:latest" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      # Scan the published image for OS/library CVEs. Fails the run on a fixable
      # CRITICAL/HIGH so a vulnerable base image surfaces instead of shipping silently.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.ref }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
